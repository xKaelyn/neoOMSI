
name: Test 32-bit Legacy Plugin Host

on:
  push:
    branches: [patch-1]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add i686-pc-windows-gnu

      - name: Install MinGW compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build legacy plugin host
        run: bash scripts/build-plugin-host.sh

      - name: Verify executable exists
        run: |
          test -s dist/legacy-plugin-host32.exe
          file dist/legacy-plugin-host32.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: legacy-plugin-host32
          path: dist/legacy-plugin-host32.exe
